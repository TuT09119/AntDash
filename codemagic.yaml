workflows:
  build-ipa:
    name: Build CarDash IPA
    max_build_duration: 60
    scripts:
      - name: Install tools
        script: |
          export PATH="/opt/homebrew/bin:$PATH"
          brew install xcodegen
          brew install ldid
      - name: Build unsigned + fakesign
        script: |
          cd CarDash
          xcodegen generate
          xcodebuild -project CarDash.xcodeproj -scheme CarDash -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          APP=build/Build/Products/Release-iphoneos/CarDash.app
          ldid -SCarDash.entitlements "$APP/CarDash"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr CarDash.ipa Payload
          ls -lh CarDash.ipa
    artifacts:
      - CarDash/CarDash.ipa
