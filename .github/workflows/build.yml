name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装工具
        run: |
          brew install xcodegen
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid || \
            curl -L -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64 || \
            curl -L -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_x86_64
            chmod +x /usr/local/bin/ldid
          fi

      - name: 生成工程并编译
        working-directory: CarDash
        run: |
          xcodegen generate
          xcodebuild -project CarDash.xcodeproj \
            -scheme CarDash \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: 注入 CarPlay 权限并打包 IPA
        working-directory: CarDash
        run: |
          APP=build/Build/Products/Release-iphoneos/CarDash.app
          ldid -SCarDash.entitlements "$APP/CarDash"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr CarDash.ipa Payload
          ls -lh CarDash.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarDash-IPA
          path: CarDash/CarDash.ipa
