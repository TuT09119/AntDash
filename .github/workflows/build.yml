name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译
        run: |
          xcodebuild -project AntDash.xcodeproj \
            -scheme AntDash \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AntDash.app Payload/
          zip -qr AntDash.ipa Payload
          ls -lh AntDash.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AntDash-IPA
          path: AntDash.ipa
